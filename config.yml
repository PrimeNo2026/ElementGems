# ElementGems Konfiguration. Nach Aenderungen den Server neu starten.

# Chat-Meldungen an alle Spieler (Gem errungen, zerstoert, Kiste erschienen, geborgen)
broadcast: true

spawn:
  # Wird ein Gem zerstoert (Lava, Void, ...), erscheint am naechsten Minecraft-Tag eine Kiste
  # in diesem Abstand (Bloecke) um den Weltspawn.
  respawn-min-distance: 50
  respawn-max-distance: 500

# Abklingzeiten in Sekunden
cooldowns:
  red:
    ring: 14
    fireball: 5
  blue:
    arrow: 1.5
    boost: 12
  yellow:
    lightning: 12
    teleport: 6
  purple:
    skeletons: 40
    blind: 18

red:
  ring-radius: 5.0
  ring-damage: 4.0          # 2 Herzen
  ring-fire-seconds: 3
  ring-knockback: 1.6
  fireball-power: 1.0       # Explosionsstaerke (Ghast = 1)
  fireball-block-damage: false

blue:
  arrow-damage: 2.0
  arrow-speed: 2.8
  boost-forward: 1.3
  boost-up: 0.6
  landing-speed-seconds: 4
  landing-speed-level: 2    # Speed II

yellow:
  lightning-range: 30
  lightning-radius: 3.0
  paralyze-seconds: 2.0
  teleport-distance: 12
  haste-level: 2

purple:
  skeleton-count: 3
  skeleton-max: 6           # maximal gleichzeitig lebende Gem-Skelette
  blind-radius: 8.0
  blind-seconds: 6

display:
  # Hoehe des schwebenden Gems ueber dem Kopf (zusaetzlich zur Koerpergroesse)
  height-offset: 0.65
  scale: 0.55
