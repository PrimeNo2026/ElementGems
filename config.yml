# ElementGems Konfiguration. Nach Aenderungen den Server neu starten.

# Chat-Meldungen an alle Spieler (Gem errungen, zerstoert, Kiste erschienen, geborgen)
broadcast: true

spawn:
  # Wird ein Gem zerstoert (Lava, Void, ...), erscheint am naechsten Minecraft-Tag eine Kiste
  # in diesem Abstand (Bloecke) um den Weltspawn.
  respawn-min-distance: 50
  respawn-max-distance: 500

# Abklingzeiten in Sekunden
cooldowns:
  red:
    ring: 8
    fireball: 4
  blue:
    wave: 10
    boost: 9
    bow: 0.8          # Wasserpfeil mit Bogen
    crossbow: 1.3     # Wasserpfeil mit Armbrust
  yellow:
    lightning: 9
    teleport: 10
  purple:
    skeletons: 30
    blind: 14

# Schadenswerte sind "Magieschaden": Er ignoriert Ruestung und Schild, wird aber vom
# Schutz-Zauber (Protection) verringert. 2 Punkte = 1 Herz. Gegen Protection IV auf allen
# Teilen kommen ca. 36 % an, gegen Protection III ca. 52 %, gegen unverzauberte Ruestung 100 %.
red:
  ring-radius: 6.0
  ring-damage: 9.0           # + Feuer
  ring-fire-seconds: 5
  ring-knockback: 1.9
  fireball-damage: 12.0      # Flaechenschaden + Feuer
  fireball-radius: 4.0
  fireball-fire-seconds: 6

blue:
  bow-damage: 8.0            # pro Wasserpfeil (Power-Zauber: +10 % je Stufe)
  bow-speed: 3.0
  crossbow-damage: 11.0
  crossbow-speed: 3.2
  arrow-slow-seconds: 2
  wave-radius: 5.5           # Rechtsklick: Flutwelle
  wave-damage: 6.0
  wave-knockback: 2.0
  wave-slow-seconds: 3
  boost-forward: 1.8
  boost-up: 0.75
  landing-damage: 8.0        # Wasserwelle beim Landen nach dem Boost
  landing-radius: 4.0
  landing-speed-seconds: 6
  landing-speed-level: 3     # Speed III

yellow:
  lightning-range: 40
  lightning-radius: 3.5
  lightning-damage: 12.0     # + Paralyse
  paralyze-seconds: 2.0
  teleport-distance: 35
  haste-level: 2
  speed-level: 1

purple:
  skeleton-count: 4
  skeleton-max: 8            # maximal gleichzeitig lebende Gem-Skelette
  skeleton-damage: 4.0       # pro Nahkampf-Treffer
  blind-radius: 10.0
  blind-damage: 5.0
  blind-seconds: 8
  blind-slow-seconds: 4

display:
  # Hoehe des schwebenden Gems ueber dem Kopf (zusaetzlich zur Koerpergroesse)
  height-offset: 0.65
  scale: 0.55
  orbit-radius: 0.55       # Kreisradius, wenn jemand mehrere Gems hat
  orbit-seconds: 4         # Dauer einer vollen Umdrehung
  hide-from-owner: true    # Besitzer sieht seine eigenen Gems nicht
